<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba mínima de Firestore</title>
<style>
  body{font-family:sans-serif; max-width:600px; margin:40px auto; padding:0 20px; font-size:18px; line-height:1.6;}
  button{font-size:18px; padding:12px 24px; margin:8px 0; cursor:pointer;}
  #out{white-space:pre-wrap; background:#f4f4f4; padding:16px; border-radius:8px; margin-top:16px; font-family:monospace; font-size:14px;}
  .ok{color:green; font-weight:bold;}
  .err{color:red; font-weight:bold;}
</style>
</head>
<body>
<h1>Prueba mínima de Firestore</h1>
<p>Paso 1: iniciar sesión. Paso 2: intentar escribir un documento de prueba. Todo el resultado (éxito o error exacto) aparece abajo.</p>

<div>
  <input type="email" id="email" placeholder="Email" style="font-size:16px; padding:8px; width:250px;"><br>
  <input type="password" id="password" placeholder="Contraseña" style="font-size:16px; padding:8px; width:250px;"><br>
  <button id="loginBtn">1. Iniciar sesión</button>
</div>

<div>
  <button id="writeBtn" disabled>2. Escribir documento de prueba</button>
</div>

<div id="out">Esperando...</div>

<script type="module">
import { firebaseConfig } from "./assets/firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const out = document.getElementById("out");
function log(msg, cls){
  const line = document.createElement("div");
  if(cls) line.className = cls;
  line.textContent = msg;
  out.appendChild(line);
}

log("Inicializando Firebase con proyecto: " + firebaseConfig.projectId);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app); // configuración simple, sin forzar nada

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  log("Intentando iniciar sesión con: " + email);
  try{
    const cred = await signInWithEmailAndPassword(auth, email, password);
    log("✅ Sesión iniciada. UID: " + cred.user.uid, "ok");
    document.getElementById("writeBtn").disabled = false;
  }catch(err){
    log("❌ ERROR AL INICIAR SESIÓN", "err");
    log("Código: " + err.code, "err");
    log("Mensaje: " + err.message, "err");
  }
});

document.getElementById("writeBtn").addEventListener("click", async ()=>{
  log("Intentando escribir documento de prueba en la colección 'test'...");
  const startTime = Date.now();

  const timeoutWarning = setTimeout(()=>{
    log("⚠️ Han pasado 10 segundos y todavía no hay respuesta (ni éxito ni error). Esto confirma que la escritura queda colgada.", "err");
  }, 10000);

  try{
    const ref = await addDoc(collection(db, "test"), {
      hello: "world",
      createdAt: Date.now()
    });
    clearTimeout(timeoutWarning);
    const elapsed = Date.now() - startTime;
    log("✅ ¡ÉXITO! Documento creado con ID: " + ref.id + " en " + elapsed + "ms", "ok");
  }catch(err){
    clearTimeout(timeoutWarning);
    log("❌ ERROR AL ESCRIBIR", "err");
    log("Código: " + err.code, "err");
    log("Mensaje: " + err.message, "err");
  }
});
</script>
</body>
</html>
